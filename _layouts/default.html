<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">跳到正文</a>
  <header class="site-header">
    <a class="site-name" href="{{ '/journal/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="主导航">
      <a href="{{ '/journal/' | relative_url }}">文章</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
    </nav>
  </header>
  <main id="content" class="reading">
    {{ content }}
  </main>
  <footer class="site-footer">{{ site.title }}<span>山野见闻与日常记录</span></footer>
</body>
</html>
